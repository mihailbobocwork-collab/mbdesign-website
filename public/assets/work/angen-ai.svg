 x="777" y="370" font-size="13" fill="#a4bbcd" font-weight="400">  return (</text><text x="745" y="400" font-size="12" fill="#625a74" font-weight="400">3</text><text x="777" y="400" font-size="13" fill="#a4bbcd" font-weight="400">    &lt;main className=&quot;welcome&quot;&gt;</text><text x="745" y="430" font-size="12" fill="#625a74" font-weight="400">4</text><text x="777" y="430" font-size="13" fill="#c0a5df" font-weight="400">      &lt;StepIndicator current={1} /&gt;</text><text x="745" y="460" font-size="12" fill="#625a74" font-weight="400">5</text><text x="777" y="460" font-size="13" fill="#a4bbcd" font-weight="400">      &lt;h1&gt;A good place to start.&lt;/h1&gt;</text><text x="745" y="490" font-size="12" fill="#625a74" font-weight="400">6</text><text x="777" y="490" font-size="13" fill="#a4bbcd" font-weight="400">      &lt;p&gt;Let’s set up your workspace.&lt;/p&gt;</text><text x="745" y="520" font-size="12" fill="#625a74" font-weight="400">7</text><text x="777" y="520" font-size="13" fill="#c0a5df" font-weight="400">      &lt;WorkspaceForm /&gt;</text><text x="745" y="550" font-size="12" fill="#625a74" font-weight="400">8</text><text x="777" y="550" font-size="13" fill="#a4bbcd" font-weight="400">      &lt;Button&gt;Continue&lt;/Button&gt;</text><text x="745" y="580" font-size="12" fill="#625a74" font-weight="400">9</text><text x="777" y="580" font-size="13" fill="#a4bbcd" font-weight="400">    &lt;/main&gt;</text><text x="745" y="610" font-size="12" fill="#625a74" font-weight="400">10</text><text x="777" y="610" font-size="13" fill="#c0a5df" font-weight="400">  );</text><text x="745" y="640" font-size="12" fill="#625a74" font-weight="400">11</text><text x="777" y="640" font-size="13" fill="#a4bbcd" font-weight="400">}</text><rect x="748" y="723" width="539" height="73" rx="6" fill="#25232d" stroke="none"/><text x="766" y="751" font-size="19" fill="#e2dbea" font-weight="600">A good place to start.</text><text x="766" y="778" font-size="11" fill="#9b90a9" font